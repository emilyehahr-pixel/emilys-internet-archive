<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanfiction Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --container-bg: rgba(25, 20, 40, 0.75);
            --text-color: #f3e8ff;
            --muted-text: #c4b5fd;
            --card-bg: rgba(35, 27, 58, 0.85);
            --accent-color: #c084fc; 
            --accent-hover: #e9d5ff;
            --accent-glow: rgba(192, 132, 252, 0.4);
            --star-color: #fbbf24;
            --font-main: 'Inter', sans-serif;
            --font-cursive: 'Pacifico', cursive;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            background-image: radial-gradient(rgba(192, 132, 252, 0.15), rgba(255,255,255,0) 2px, transparent 2px);
            background-size: 40px 40px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .star-decoration {
            position: fixed;
            color: var(--star-color);
            font-size: 24px;
            text-shadow: 0 0 10px var(--star-color), 0 0 20px var(--accent-color);
            animation: twinkle 2s infinite ease-in-out;
            z-index: 999;
            pointer-events: none;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- LOGIN OVERLAY STYLES --- */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            background-image: radial-gradient(rgba(192, 132, 252, 0.15), rgba(255,255,255,0) 2px, transparent 2px);
            background-size: 40px 40px;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: var(--card-bg);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 18px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }

        .login-box h2 {
            font-family: var(--font-cursive);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #c084fc, #e9d5ff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(192, 132, 252, 0.3));
        }

        .login-box p {
            color: var(--muted-text);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .login-box input[type="password"] {
            width: 80%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(192, 132, 252, 0.3);
            border-radius: 30px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-box button {
            background: linear-gradient(135deg, #a855f7, #c084fc);
            color: #0f0c1b;
            border: none;
            padding: 12px 35px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-box button:hover {
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        #login-error {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }

        header { text-align: center; padding: 30px 20px 10px; position: relative; }

        h1 {
            font-family: var(--font-cursive);
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, #c084fc, #e9d5ff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 15px rgba(192, 132, 252, 0.5));
        }

        .subtitle {
            color: var(--muted-text);
            font-size: 0.9rem;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex; justify-content: center; gap: 15px; margin: 25px 0;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(192, 132, 252, 0.3);
            color: var(--muted-text);
            padding: 10px 25px; border-radius: 30px;
            cursor: pointer; font-weight: 600; font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-color);
            color: #0f0c1b;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Controls & Filters Bar */
        .controls-container {
            max-width: 900px; margin: 20px auto 35px auto;
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;
        }

        input[type="text"], select {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(192, 132, 252, 0.3);
            border-radius: 30px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(10px);
        }

        input[type="text"] { flex: 1; min-width: 280px; }
        select { cursor: pointer; }
        select option { background: #1a1528; color: var(--text-color); }

        .trope-section {
            margin-bottom: 50px; max-width: 1400px;
            margin-left: auto; margin-right: auto;
            padding: 0 20px;
        }

        .trope-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-left: 20px;
            border-left: 5px solid var(--accent-color);
        }

        .trope-title {
            font-size: 1.4rem; font-weight: 700; color: #e9d5ff; margin: 0;
        }

        .more-like-this-btn {
            background: none; border: 1px solid var(--accent-color);
            color: var(--accent-hover); padding: 5px 15px; border-radius: 20px;
            cursor: pointer; font-size: 0.8rem; transition: all 0.2s;
        }
        .more-like-this-btn:hover { background: var(--accent-color); color: #0f0c1b; }

        .fic-slider {
            display: flex; gap: 25px; overflow-x: auto;
            padding: 10px 5px 25px 5px; scroll-behavior: smooth;
        }

        .fic-slider::-webkit-scrollbar { height: 8px; }
        .fic-slider::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 10px; }
        .fic-slider::-webkit-scrollbar-thumb { background: rgba(192, 132, 252, 0.3); border-radius: 10px; }

        .fic-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; max-width: 1400px; margin: 0 auto; padding: 0 20px;
        }

        .fic-card {
            flex: 0 0 300px;
            background: var(--card-bg);
            border: 1px solid rgba(192, 132, 252, 0.1);
            border-radius: 18px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.3s ease; position: relative;
        }

        .fic-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-color);
            box-shadow: 0 15px 40px var(--accent-glow);
        }

        .fic-cover {
            width: 100%; height: 160px; object-fit: cover;
            border-radius: 10px; margin-bottom: 12px;
            border: 1px solid rgba(192, 132, 252, 0.2);
            background: rgba(0,0,0,0.3);
        }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .fic-title { font-size: 1.1rem; font-weight: 700; color: #ffffff; margin: 0 0 4px 0; }
        .star-icon { cursor: pointer; color: #6b7280; font-size: 1.2rem; transition: color 0.2s; }
        .star-icon.starred { color: var(--star-color); text-shadow: 0 0 8px var(--star-color); }

        .fic-author { font-size: 0.85rem; color: var(--muted-text); font-style: italic; margin-bottom: 10px; }
        .fic-summary {
            font-size: 0.82rem; line-height: 1.4; color: var(--muted-text);
            margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }

        .tags-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
        .tag {
            font-size: 0.68rem; background: rgba(192, 132, 252, 0.1);
            color: var(--accent-hover); padding: 3px 8px; border-radius: 15px;
            border: 1px solid rgba(192, 132, 252, 0.2);
        }

        .fic-stats {
            font-size: 0.78rem; color: #9ca3af; display: flex; justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 10px; margin-bottom: 12px;
        }

        .button-row { display: flex; gap: 8px; }
        .action-btn {
            flex: 1; border: none; padding: 8px; border-radius: 8px;
            font-weight: 600; font-size: 0.78rem; cursor: pointer;
            text-align: center; text-decoration: none; transition: opacity 0.2s;
        }
        .download-btn { background: rgba(168, 85, 247, 0.2); color: var(--text-color); border: 1px solid rgba(168, 85, 247, 0.4); }
        .read-btn { background: linear-gradient(135deg, #a855f7, #c084fc); color: #0f0c1b; }

        /* Reader Modal */
        #reader-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 27, 0.95); z-index: 1000; backdrop-filter: blur(10px); flex-direction: column;
        }
        #reader-modal.active { display: flex; }
        .modal-header {
            padding: 15px 30px; background: rgba(35, 27, 58, 0.95);
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(192, 132, 252, 0.2);
        }
        .modal-title { font-size: 1.1rem; font-weight: 700; color: #ffffff; }
        .modal-controls { display: flex; gap: 15px; align-items: center; }
        .modal-btn { background: rgba(255, 255, 255, 0.1); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .close-modal { font-size: 1.5rem; color: #ff4d4d; cursor: pointer; background: none; border: none; }
        #viewer { flex: 1; max-width: 900px; width: 100%; margin: 20px auto; background: white; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body>

    <!-- Stars are kept outside so they show on the login screen too! -->
    <div class="star-decoration" style="top: 10%; left: 5%;">✦</div>
    <div class="star-decoration" style="top: 20%; right: 8%;">✨</div>
    <div class="star-decoration" style="top: 70%; left: 3%;">✦</div>
    <div class="star-decoration" style="top: 85%; right: 5%;">✨</div>

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Welcome</h2>
            <p>Please enter the password to access the archive.</p>
            <input type="password" id="passwordInput" placeholder="Enter password...">
            <button onclick="checkPassword()">Unlock Archive</button>
            <div id="login-error">Incorrect password. Please try again.</div>
        </div>
    </div>

    <!-- MAIN ARCHIVE CONTENT (Hidden until unlocked) -->
    <div id="main-content" style="display: none;">
        <header>
            <h1>Fanfiction Archive</h1>
            <div class="subtitle">By Emily for Emily (and friends)</div>
            
            <div class="nav-tabs">
                <button class="tab-btn active" id="tabHome" onclick="switchTab('home')">Main Archive</button>
                <button class="tab-btn" id="tabForgotten" onclick="switchTab('forgotten')">The Forgotten Gals ✨</button>
            </div>
        </header>

        <div class="controls-container">
            <input type="text" id="searchInput" placeholder="Search title, author, or tag...">
            <select id="tagFilter">
                <option value="">All Tags / Tropes</option>
            </select>
            <select id="sortSelect">
                <option value="reads">Sort by: Readers</option>
                <option value="words">Sort by: Word Count</option>
            </select>
        </div>

        <main id="archiveContainer">
            <div style="text-align: center; color: var(--muted-text); padding: 40px;" id="loadingStatus">Loading your library...</div>
        </main>

        <!-- READER MODAL -->
        <div id="reader-modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-fic-title">Reading Book</div>
                <div class="modal-controls">
                    <button class="modal-btn" id="prev-page">← Prev</button>
                    <button class="modal-btn" id="next-page">Next →</button>
                    <button class="close-modal" id="closeReader">×</button>
                </div>
            </div>
            <div id="viewer"></div>
        </div>
    </div>

    <script>
        // --- PASSWORD PROTECTION LOGIC ---
        // Change "friends" to whatever you want the password to be!
        const ARCHIVE_PASSWORD = "friends"; 

        // Check if already logged in during this session
        if (sessionStorage.getItem('archiveUnlocked') === 'true') {
            unlockArchive();
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === ARCHIVE_PASSWORD) {
                sessionStorage.setItem('archiveUnlocked', 'true');
                unlockArchive();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function unlockArchive() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        // Allow pressing "Enter" on the keyboard to submit the password
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });


        // --- ORIGINAL ARCHIVE LOGIC ---
        let allFics = [];
        let starredFics = JSON.parse(localStorage.getItem('starredFics') || '[]');
        let currentTab = 'home';

        fetch('metadata.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('loadingStatus').style.display = 'none';
                allFics = data.stories || data;
                populateTagDropdown();
                applyFilters();
            })
            .catch(() => {
                document.getElementById('loadingStatus').innerText = "metadata.json not found yet.";
            });

        function populateTagDropdown() {
            const tagSet = new Set();
            allFics.forEach(f => (f.tags || f.tropes || []).forEach(t => tagSet.add(t)));
            const select = document.getElementById('tagFilter');
            select.innerHTML = '<option value="">All Tags / Tropes</option>';
            tagSet.forEach(tag => {
                const opt = document.createElement('option');
                opt.value = tag;
                opt.textContent = tag;
                select.appendChild(opt);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabHome').classList.toggle('active', tab === 'home');
            document.getElementById('tabForgotten').classList.toggle('active', tab === 'forgotten');
            applyFilters();
        }

        function getReadableTitle(fic) {
            if (fic.title && fic.title !== "Unknown" && !fic.title.startsWith("Story ")) return fic.title;
            const filename = fic.filename || fic.epubFile || "";
            const cleanName = filename.split('/').pop().replace('.epub', '').replace(/[_.-]/g, ' ');
            return cleanName ? cleanName.charAt(0).toUpperCase() + cleanName.slice(1) : "Untitled Fic";
        }

        function isForgottenGal(fic) {
            const titleLower = getReadableTitle(fic).toLowerCase();
            const wordCount = fic.word_count || fic.wordCount || 0;
            return wordCount < 60000 || titleLower.includes('imagine') || titleLower.includes('imagines');
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedTag = document.getElementById('tagFilter').value;
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = allFics.filter(fic => {
                const title = getReadableTitle(fic);
                const matchQuery = (title + (fic.author || '') + (fic.tags || []).join(' ')).toLowerCase().includes(query);
                const matchTag = !selectedTag || (fic.tags || fic.tropes || []).includes(selectedTag);
                
                const forgotten = isForgottenGal(fic);
                const matchTab = (currentTab === 'forgotten') ? forgotten : !forgotten;

                return matchQuery && matchTag && matchTab;
            });

            if (sortBy === 'reads') {
                filtered.sort((a, b) => (b.reads || 0) - (a.reads || 0));
            } else if (sortBy === 'words') {
                filtered.sort((a, b) => (b.word_count || b.wordCount || 0) - (a.word_count || a.wordCount || 0));
            }

            renderArchive(filtered);
        }

        function renderArchive(fics) {
            const container = document.getElementById('archiveContainer');
            container.innerHTML = '';

            if (currentTab === 'forgotten') {
                if (fics.length === 0) {
                    container.innerHTML = `<div style="text-align: center; color: var(--muted-text); padding: 40px;">No stories found in The Forgotten Gals.</div>`;
                    return;
                }
                const grid = document.createElement('div');
                grid.className = 'fic-grid';
                fics.forEach(fic => grid.appendChild(createCard(fic)));
                container.appendChild(grid);
                return;
            }

            // Home Tab: Best Sellers Banner + Netflix Sliders
            const starredList = fics.filter(f => starredFics.includes(f.id || f.filename));
            if (starredList.length > 0) {
                container.appendChild(createTropeSlider("Best Sellers ⭐", starredList, false));
            }

            const tropes = {};
            fics.forEach(fic => {
                const primaryTags = fic.tags || fic.tropes || [];
                const trope = primaryTags.length > 0 ? primaryTags[0] : 'All Time Favorites';
                if (!tropes[trope]) tropes[trope] = [];
                tropes[trope].push(fic);
            });

            for (const trope in tropes) {
                tropes[trope].sort((a, b) => (b.reads || 0) - (a.reads || 0));
                const top10 = tropes[trope].slice(0, 10);
                container.appendChild(createTropeSlider(trope, top10, true));
            }
        }

        function createTropeSlider(title, fics, showMoreBtn) {
            const section = document.createElement('section');
            section.className = 'trope-section';
            
            let headerHTML = `<div class="trope-title">${title}</div>`;
            if (showMoreBtn) {
                headerHTML += `<button class="more-like-this-btn" onclick="filterByTag('${title}')">More Like This →</button>`;
            }

            section.innerHTML = `
                <div class="trope-header">${headerHTML}</div>
                <div class="fic-slider"></div>
            `;

            const slider = section.querySelector('.fic-slider');
            fics.forEach(fic => slider.appendChild(createCard(fic)));
            return section;
        }

        function createCard(fic) {
            const ficId = fic.id || fic.filename;
            const isStarred = starredFics.includes(ficId);
            const title = getReadableTitle(fic);
            const coverImg = fic.cover_image || fic.cover || '';
            const epubPath = `epub/${fic.filename || fic.epubFile}`;

            const card = document.createElement('div');
            card.className = 'fic-card';
            card.innerHTML = `
                <div>
                    ${coverImg ? `<img src="${coverImg}" class="fic-cover" alt="Cover">` : '<div class="fic-cover" style="display:flex;align-items:center;justify-content:center;color:var(--muted-text);font-size:0.8rem;">No Cover</div>'}
                    <div class="card-header">
                        <h3 class="fic-title">${title}</h3>
                        <span class="star-icon ${isStarred ? 'starred' : ''}" onclick="toggleStar('${ficId}')">★</span>
                    </div>
                    <div class="fic-author">${fic.author || 'Unknown Author'}</div>
                    <div class="fic-summary">${fic.summary || 'No summary available.'}</div>
                    <div class="tags-container">
                        ${(fic.tags || fic.tropes || []).map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                </div>
                <div>
                    <div class="fic-stats">
                        <span>👥 ${(fic.reads || 0).toLocaleString()}</span>
                        <span>📖 ${(fic.word_count || fic.wordCount || 0).toLocaleString()}w</span>
                    </div>
                    <div class="button-row">
                        <a href="${epubPath}" class="action-btn download-btn" download>Download</a>
                        <button class="action-btn read-btn" onclick="openReader('${epubPath}', '${title.replace(/'/g, "\\'")}')">Read Web</button>
                    </div>
                </div>
            `;
            return card;
        }

        function toggleStar(ficId) {
            if (starredFics.includes(ficId)) {
                starredFics = starredFics.filter(id => id !== ficId);
            } else {
                starredFics.push(ficId);
            }
            localStorage.setItem('starredFics', JSON.stringify(starredFics));
            applyFilters();
        }

        function filterByTag(tag) {
            document.getElementById('tagFilter').value = tag;
            applyFilters();
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('tagFilter').addEventListener('change', applyFilters);
        document.getElementById('sortSelect').addEventListener('change', applyFilters);

        // EPUB Reader Logic
        let bookInstance = null, renditionInstance = null;
        function openReader(path, title) {
            document.getElementById('modal-fic-title').innerText = "Reading: " + title;
            document.getElementById('reader-modal').classList.add('active');
            document.getElementById('viewer').innerHTML = '';
            bookInstance = ePub(path);
            renditionInstance = bookInstance.renderTo("viewer", { width: "100%", height: "100%" });
            renditionInstance.display();
        }
        document.getElementById('prev-page').addEventListener('click', () => renditionInstance && renditionInstance.prev());
        document.getElementById('next-page').addEventListener('click', () => renditionInstance && renditionInstance.next());
        document.getElementById('closeReader').addEventListener('click', () => {
            document.getElementById('reader-modal').classList.remove('active');
            if (bookInstance) bookInstance.destroy();
        });
    </script>
</body>
</html>
